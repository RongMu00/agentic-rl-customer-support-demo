[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rl-safety-demo"
version = "0.1.0"
description = "A runnable demonstration of safe agent execution, reward verification, and optional small-model training smoke tests."
requires-python = ">=3.10"
authors = [{name = "Rong Mu"}]
dependencies = []

[project.optional-dependencies]
training-smoke = [
    "torch>=2.3",
    "transformers>=4.48,<6",
]

[project.scripts]
agentic-rl-demo = "agentic_rl_demo.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_rl_demo*", "training_smoke*", "public_experiment*"]

[tool.setuptools.package-data]
training_smoke = ["data/*.jsonl"]
public_experiment = ["data/*.jsonl", "data/*.json", "requirements-colab.txt"]
